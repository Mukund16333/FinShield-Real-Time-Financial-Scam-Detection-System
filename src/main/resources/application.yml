spring:
  application:
    name: finshield
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/finshield_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  sql:
    init:
      mode: never   # switch to "always" if you want data.sql to run

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

finshield:
  jwt:
    secret: ${JWT_SECRET:ZmluU2hpZWxkU2VjcmV0S2V5Rm9ySnd0U2lnbmluZ011c3RCZTI1NkJpdHNPckxvbmdlcg==}
    expiration-ms: 86400000   # 24 hours
  fraud:
    amount-threshold: 50000
    velocity:
      max-transactions: 5
      window-minutes: 10

logging:
  level:
    root: INFO
    com.finshield: DEBUG
    org.springframework.security: INFO

# Activated when spring.profiles.active=dev (the default in application.yml)
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/finshield_dev_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  sql:
    init:
      mode: always   # runs data.sql on startup for local seed data

logging:
  level:
    root: INFO
    com.finshield: DEBUG
    org.hibernate.SQL: DEBUG

finshield:
  jwt:
    expiration-ms: 86400000  # 24h — long-lived for convenient local testing

# Activated with -Dspring.profiles.active=prod (or SPRING_PROFILES_ACTIVE=prod)
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/finshield_db?useSSL=true&serverTimezone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate   # never let Hibernate auto-alter schema in prod
    show-sql: false

  sql:
    init:
      mode: never           # never run seed data against production

server:
  port: ${PORT:8080}

logging:
  level:
    root: WARN
    com.finshield: INFO
    org.springframework.security: WARN

finshield:
  jwt:
    secret: ${JWT_SECRET}   # must be supplied via env var — no default in prod
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}   # shorter-lived tokens (1h) in prod
